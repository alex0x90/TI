title: Run Key Persistence Named KlUpd Pointing to ProgramData
id: f6c396c4-0902-55c7-9d4d-0fd62a18516d
status: experimental
description: Detects creation of an HKLM Run value named KlUpd that points to a ProgramData path, mimicking Kaspersky update tooling. The .NET implant svc.exe writes this value to persist.
references:
- https://www.infrahunter.com/research/a-staged-post-exploitation-toolkit-targeting-pakistan-cricket-board
author: ti-scraper (generated by AI)
date: 2026-11-24
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1547.001
- attack.stealth
- attack.t1036.005
logsource:
  category: registry_set
  product: windows
detection:
  selection_key:
    TargetObject|contains: \CurrentVersion\Run\KlUpd
  selection_path:
    Details|contains: \ProgramData\\
  condition: selection_key and selection_path
falsepositives:
- Unlikely; legitimate Kaspersky installs do not normally run from ProgramData under this value name
level: high
