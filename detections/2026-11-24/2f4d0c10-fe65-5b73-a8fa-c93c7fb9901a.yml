title: ConsentPromptBehaviorAdmin Set to 0 by Script Host
id: 2f4d0c10-fe65-5b73-a8fa-c93c7fb9901a
status: experimental
description: Detects a Windows script host (wscript/cscript) setting ConsentPromptBehaviorAdmin to 0, which disables UAC elevation prompts for admins. The VBS dropper in the WhatsApp campaign does this after pestering the user with runas prompts.
references:
- https://www.watchguard.com/wgrd-security-hub/secplicity-blog/how-hackers-use-whatsapp-and-telegram-hijack-windows-pcs
author: ti-scraper (generated by AI)
date: 2026-11-24
tags:
- attack.privilege-escalation
- attack.t1548.002
- attack.defense-impairment
- attack.persistence
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection_key:
    TargetObject|endswith: \Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin
    Details: DWORD (0x00000000)
  selection_image:
    Image|endswith:
    - \wscript.exe
    - \cscript.exe
  condition: selection_key and selection_image
falsepositives:
- Rare administrative scripts that deliberately disable UAC prompts
level: high
