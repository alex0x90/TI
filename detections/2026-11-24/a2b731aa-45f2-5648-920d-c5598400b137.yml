title: Node.js Interactive Shell Spawned by Python Process
id: a2b731aa-45f2-5648-920d-c5598400b137
status: experimental
description: Detects a python process launching node with the interactive flag (-i), as the PolinRider Python loader's JavaScript stage does to run later stages from stdin. Python spawning an interactive Node REPL is not normal behavior.
references:
- https://safedep.io/blog/polinrider-python-loader-ethereum-calldata
author: ti-scraper (generated by AI)
date: 2026-11-24
tags:
- attack.execution
- attack.t1059.007
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - \python.exe
    - \pythonw.exe
    - \python3.exe
  selection_child:
    Image|endswith: \node.exe
    CommandLine|endswith:
    - ' -i'
    - \node.exe" -i
  condition: selection_parent and selection_child
falsepositives:
- Developers manually launching an interactive Node REPL from a Python-driven script
level: high
