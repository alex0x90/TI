title: Scheduled Task Created to Run as SYSTEM Every Minute Pointing to ProgramData
id: b01ee3c6-cb4e-5882-9075-1a33eb7e3ff8
status: experimental
description: Detects schtasks creation of a SYSTEM-level task that runs from a ProgramData path at startup or minute intervals, as used by the svc.exe implant's persistence (SvcHost/SvcKeep). Executables launched from ProgramData by SYSTEM tasks are uncommon in normal operations.
references:
- https://www.infrahunter.com/research/a-staged-post-exploitation-toolkit-targeting-pakistan-cricket-board
author: ti-scraper (generated by AI)
date: 2026-11-24
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: \schtasks.exe
    CommandLine|contains|all:
    - /create
    - SYSTEM
    - ProgramData
  selection_sched:
    CommandLine|contains:
    - onstart
    - minute
  condition: selection_img and selection_sched
falsepositives:
- Third-party software installers that register SYSTEM tasks from ProgramData
level: high
