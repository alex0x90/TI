title: Run Key MicrosoftStoreUpdaterV Persistence Pointing to User Programs Directory
id: abc56cc1-0adb-5a23-92ed-b70012e8b264
status: experimental
description: Detects creation of the HKCU Run value MicrosoftStoreUpdaterV pointing at a fake Microsoft Store directory in the user profile. Enterotoxin uses this value for redundant persistence.
references:
- https://opensourcemalware.com/blog/enterotoxin-malware
author: ti-scraper (generated by AI)
date: 2026-11-24
tags:
