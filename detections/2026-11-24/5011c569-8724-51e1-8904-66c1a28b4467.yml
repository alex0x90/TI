title: ConsentPromptBehaviorAdmin Set to 0 Disabling UAC Admin Prompt
id: 5011c569-8724-51e1-8904-66c1a28b4467
status: experimental
description: Detects the UAC ConsentPromptBehaviorAdmin policy value being set to 0 (elevate without prompting). The WhatsApp VBS campaign sets this after pestering the user with runas prompts, so later elevations need no consent.
references:
- https://www.watchguard.com/wgrd-security-hub/secplicity-blog/how-hackers-use-whatsapp-and-telegram-hijack-windows-pcs
author: ti-scraper (generated by AI)
date: 2026-11-24
tags:
- attack.privilege-escalation
- attack.t1548.002
- attack.defense-impairment
- attack.persistence
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection_key:
    TargetObject|endswith: \Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin
    Details: DWORD (0x00000000)
  filter_legit:
    Image|endswith:
    - \msiexec.exe
    - \ccmexec.exe
  condition: selection_key and not filter_legit
falsepositives:
- Administrators or GPO scripts deliberately relaxing UAC settings
- Security baseline or compliance tooling
level: high
