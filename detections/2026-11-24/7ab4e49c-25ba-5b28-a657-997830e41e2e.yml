title: Executable Launched with --agent From Fake Microsoft Store Directory in User Profile
id: 7ab4e49c-25ba-5b28-a657-997830e41e2e
status: experimental
description: Detects an executable running from the user-local Programs\Microsoft Store directory with the --agent argument. This is how Enterotoxin installs and launches its persistent backdoor under a Microsoft Store name.
references:
- https://opensourcemalware.com/blog/enterotoxin-malware
author: ti-scraper (generated by AI)
date: 2026-11-24
tags:
- attack.stealth
- attack.t1036.005
- attack.persistence
- attack.privilege-escalation
- attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|contains: \AppData\Local\Programs\Microsoft Store\\
  selection_cmd:
    CommandLine|contains: ' --agent'
  condition: selection_img and selection_cmd
falsepositives:
- Unlikely; no legitimate Microsoft Store component runs from this user-writable path with --agent
level: high
