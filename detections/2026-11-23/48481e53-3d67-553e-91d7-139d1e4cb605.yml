title: On-Screen Keyboard (osk.exe) Executed from User-Writable LocalAppData Folder
id: 48481e53-3d67-553e-91d7-139d1e4cb605
status: experimental
description: Detects osk.exe launched from a user profile folder instead of System32. The campaign copies osk.exe next to a malicious OskSupport.dll in %LOCALAPPDATA%\osk to side-load the DLL.
