title: Obfuscated cmd.exe Variable Concatenation Used to Add RunOnce Persistence
id: 377ea05d-1feb-59b9-9e04-7f87af110301
status: experimental
description: Detects cmd.exe building a reg add command for the HKCU RunOnce key through chained set variables and call set expansion. OXLoader uses this obfuscation to persist its hijacked executable.
references:
- https://www.malwarebytes.com/blog/threat-intel/2026/11/oxloader-abuses-dll-hijacking-to-distribute-different-malware-families
