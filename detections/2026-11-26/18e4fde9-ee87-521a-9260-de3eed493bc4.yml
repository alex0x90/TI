title: Scheduled Task Launching pythonw from ProgramData DeviceSync Path
id: 18e4fde9-ee87-521a-9260-de3eed493bc4
status: experimental
description: Detects schtasks creating a task that runs pythonw.exe from a ProgramData\...\DeviceSync directory, as used by the trojanized Q-Dir/DesktopOK Python RAT for persistence. A Python interpreter launched from a fake Microsoft DeviceSync folder via a scheduled task is rare in legitimate use.
references:
- https://asec.ahnlab.com/ko/96826/
author: ti-scraper (generated by AI)
date: 2026-11-26
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1053.005
- attack.stealth
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    Image|endswith: \schtasks.exe
    CommandLine|contains: pythonw.exe
  selection_path:
    CommandLine|contains:
    - \ProgramData\Microsoft\DeviceSync\\
    - \ProgramData\DeviceSync\\
    - MicrosoftEdge_dcntel
  condition: selection_schtasks and selection_path
falsepositives:
- Unlikely; custom internal software using a folder named DeviceSync
level: high
