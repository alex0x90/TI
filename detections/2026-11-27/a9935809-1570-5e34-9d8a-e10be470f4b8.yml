title: PowerShell Downloads and Runs Executable from AppData via curl.exe (ClickFix Pattern)
id: a9935809-1570-5e34-9d8a-e10be470f4b8
status: experimental
description: Detects a PowerShell command line that creates a directory under AppData, downloads an .exe with curl.exe, then checks its existence with Test-Path and launches it with Start-Process. This matches the ClickFix one-liner that delivers the Olympic RAT loader.
references:
- https://cert-agid.gov.it/news/clickfix-falsa-verifica-cloudflare-su-un-portale-scolastico-diffonde-nuovo-rat-olympic-0-1-0/
author: ti-scraper (generated by AI)
date: 2026-11-27
tags:
- attack.execution
- attack.t1059.001
- attack.t1204.004
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_cmd:
    CommandLine|contains|all:
    - curl
    - New-Item
    - Test-Path
    - Start-Process
    - APPDATA
    - .exe
  condition: selection_img and selection_cmd
falsepositives:
- Rare administrator scripts that download and launch installers from AppData using curl
level: high
